name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private memories, session text, paths and keys before you post.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: DeepSeek Harness version and platform
      placeholder: 0.2.1, Windows 11, desktop app
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /memory
      description: Run /memory in a session and paste the output.
      render: text
    validations:
      required: true
